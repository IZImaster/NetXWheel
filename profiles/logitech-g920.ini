; Logitech G920 Driving Force (Xbox/PC), with the Driving Force Shifter.
; Tested with NetXWheel on a Raspberry Pi 3B+ (Raspberry Pi OS), steering, pedals, shifter and
; force feedback.

[wheel]
name = Logitech G920 Driving Force
vendor = Logitech
model = G920 Driving Force
match = G920
rotation = 900
direct_drive = no
torque_nm = 2.3
tested = yes (linux, by IZImaster)

[linux]
steering = ABS_X
throttle = ABS_Y
brake = ABS_Z
clutch = ABS_RZ
pedals_rest = high        ; the pedals read their highest value when released
hat = ABS_HAT0X ABS_HAT0Y ; the D-pad
a = 288
b = 289
x = 290
y = 291
paddle_right = 292
paddle_left = 293
menu = 294
view = 295
rsb = 296
lsb = 297
home = 298                ; the Xbox button
label_home = Xbox
reverse = 299
gear1 = 300
gear2 = 301
gear3 = 302
gear4 = 303
gear5 = 704
gear6 = 705
